{% extends "gdc_storm/base.html" %}
{% block title %}Connexion annulée - GDC Storm{% endblock %}
{% block content %}
<div class="missions-container" style="max-width:480px;margin:40px auto 0 auto;padding:32px;border-radius:18px;background:#fff;box-shadow:0 2px 16px #0002;text-align:center;">
    <div class="missions-title">Connexion annulée</div>
    <p style="margin:18px 0 24px;line-height:1.5;color:#333;">
        Vous avez annulé la connexion via un service externe.
        Vous pouvez réessayer quand vous voulez.
    </p>
    <a href="{% url 'login' %}" class="home-btn" style="background:#FFD600;color:#111;padding:10px 28px;text-decoration:none;border-radius:8px;display:inline-block;">
        Retour à la connexion
    </a>
</div>
{% endblock %}
