# Conteneur maps-cdn seul (autre serveur / isolation réseau).
services:
  ocap-maps-cdn:
    image: ${MAPS_CDN_IMAGE:-ghcr.io/gdc-framework/maps-cdn_v3:latest}
    ports:
      # Override MAPS_CDN_BIND=0.0.0.0 si le CDN doit être joignable depuis l'extérieur.
      - "${MAPS_CDN_BIND:-127.0.0.1}:${MAPS_CDN_HOST_PORT:-8080}:8080"
    environment:
      MAPS_CDN_STORAGE_PATH: /data/ocap_maps
      MAPS_CDN_SECRET: ${MAPS_CDN_SECRET:-}
      MAPS_CDN_PUBLIC_BASE_URL: ${MAPS_CDN_PUBLIC_BASE_URL:-}
      OCAP_WORLDS_URL: ${OCAP_WORLDS_URL:-https://maps.ocap2.com/worlds.json}
      OCAP_ARCHIVES_LIST_URL: ${OCAP_ARCHIVES_LIST_URL:-https://archives.ocap2.com/list}
    volumes:
      - ${OCAP_MAPS_HOST_PATH:-/var/lib/ocap_maps}:/data/ocap_maps
    restart: unless-stopped
