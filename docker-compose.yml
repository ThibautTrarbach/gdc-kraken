services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirection automatique HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Résolveur ACME (challenge HTTP)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped

  storm:
    image: ${STORM_IMAGE:-thibautblack/gdc-storm:latest}
    ports:
      # Localhost only : Traefik joignit storm via le réseau Docker (pas ce port).
      # Évite l'accès public direct tout en gardant le debug local + X-Forwarded-*.
      - "127.0.0.1:6130:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=8000"
    env_file: .env
    environment:
      SQLITE_PATH: ${SQLITE_PATH:-/data/persist/db.sqlite3}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/persist/missions}
      PLATFORM: ${PLATFORM:-DOCKER}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      OCAP_TILES_BASE_URL: ${OCAP_TILES_BASE_URL:-https://maps.ocap2.com}
      # Miroir local (même compose). Si maps-cdn tourne ailleurs, override dans .env.
      OCAP_MAPS_CDN_URL: ${OCAP_MAPS_CDN_URL:-http://ocap-maps-cdn:8080}
      OCAP_MAPS_CDN_SECRET: ${OCAP_MAPS_CDN_SECRET:-}
    volumes:
      - app_data:/data/persist
      - ${MISSIONS_PBO_HOST_PATH}:/data/missions_pbo
      # Même stockage que maps-cdn si co-hébergé (évite proxy pour les tuiles).
      # Ne pas utiliser ./ocap_maps dans le repo : risque d'inclure les Go de tuiles au docker build.
      - ${OCAP_MAPS_HOST_PATH:-/var/lib/ocap_maps}:/data/ocap_maps
    restart: unless-stopped

  # Miroir / sync tuiles OCAP (peut aussi tourner seul via docker-compose.maps.yml).
  ocap-maps-cdn:
    image: ${MAPS_CDN_IMAGE:-thibautblack/gdc-storm:maps-cdn}
    ports:
      - "127.0.0.1:${MAPS_CDN_HOST_PORT:-8080}:8080"
    environment:
      MAPS_CDN_STORAGE_PATH: /data/ocap_maps
      MAPS_CDN_SECRET: ${MAPS_CDN_SECRET:-}
      MAPS_CDN_PUBLIC_BASE_URL: ${MAPS_CDN_PUBLIC_BASE_URL:-http://ocap-maps-cdn:8080}
      OCAP_WORLDS_URL: ${OCAP_WORLDS_URL:-https://maps.ocap2.com/worlds.json}
      OCAP_ARCHIVES_LIST_URL: ${OCAP_ARCHIVES_LIST_URL:-https://archives.ocap2.com/list}
    volumes:
      - ${OCAP_MAPS_HOST_PATH:-/var/lib/ocap_maps}:/data/ocap_maps
    restart: unless-stopped

volumes:
  app_data:
  letsencrypt:
